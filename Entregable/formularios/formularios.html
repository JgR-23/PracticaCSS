<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios · Tienda IPN</title>
  <link rel="stylesheet" href="formularios.css">
  <script src="formularios.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <h1>Tienda IPN</h1>
    <p>Registro de productos y ofertas</p>
  </header>

  <main class="contenedor">

    <!-- ============ FORMULARIO 1: AGREGAR PRODUCTO ============ -->
    <section class="tarjeta" aria-labelledby="titulo-producto">
      <h2 id="titulo-producto">1. Agregar producto</h2>
      <p class="nota">Los campos marcados con * son obligatorios.</p>

      <form id="form-producto" novalidate>
        <div id="resumen-producto" class="resumen-errores" role="alert" hidden></div>

        <div class="grid">
          <div class="campo">
            <label for="codigo" class="req">Código</label>
            <input type="text" id="codigo" name="codigo" maxlength="12"
                   placeholder="Ej. IPN-001" autocomplete="off" aria-describedby="codigo-error">
            <p class="error" id="codigo-error"></p>
          </div>

          <div class="campo">
            <label for="categoria" class="req">Categoría</label>
            <select id="categoria" name="categoria" aria-describedby="categoria-error">
              <option value="">Selecciona una categoría</option>
              <option>Ropa y uniformes</option>
              <option>Papelería</option>
              <option>Libros y apuntes</option>
              <option>Tecnología</option>
              <option>Souvenirs</option>
              <option>Alimentos y bebidas</option>
              <option>Otros</option>
            </select>
            <p class="error" id="categoria-error"></p>
          </div>

          <div class="campo ancho">
            <label for="nombre" class="req">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="60"
                   placeholder="Ej. Sudadera guinda IPN" autocomplete="off" aria-describedby="nombre-error">
            <p class="error" id="nombre-error"></p>
          </div>

          <div class="campo">
            <label for="precio" class="req">Precio (MXN)</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0"
                   placeholder="0.00" inputmode="decimal" aria-describedby="precio-error">
            <p class="error" id="precio-error"></p>
          </div>

          <div class="campo">
            <label for="existencia" class="req">Existencia</label>
            <input type="number" id="existencia" name="existencia" step="1" min="0"
                   placeholder="Piezas disponibles" inputmode="numeric" aria-describedby="existencia-error">
            <p class="error" id="existencia-error"></p>
          </div>

          <div class="campo ancho">
            <label for="descripcion" class="req">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4" maxlength="300"
                      placeholder="Describe el producto (mínimo 10 caracteres)"
                      aria-describedby="descripcion-error"></textarea>
            <div class="contador" id="contador">0/300</div>
            <p class="error" id="descripcion-error"></p>
          </div>

          <div class="campo ancho">
            <label for="imagen" class="req">Imagen</label>
            <input type="file" id="imagen" name="imagen"
                   accept="image/png,image/jpeg,image/webp" aria-describedby="imagen-error">
            <p class="error" id="imagen-error"></p>
            <img id="vista-previa" class="vista-previa" alt="Vista previa de la imagen seleccionada" hidden>
          </div>
        </div>

        <div class="botones">
          <button type="submit" class="btn-primario">Guardar producto</button>
          <button type="reset" class="btn-secundario">Limpiar</button>
        </div>
      </form>

      <div id="resultado-producto" class="resultado" aria-live="polite" hidden></div>
    </section>

    <!-- ============ FORMULARIO 2: OFERTA ============ -->
    <section class="tarjeta" aria-labelledby="titulo-oferta">
      <h2 id="titulo-oferta">2. Agregar oferta</h2>
      <p class="nota">Elige un producto registrado y asígnale un descuento.</p>

      <p id="aviso-sin-productos" class="aviso" hidden>
        Aún no hay productos registrados. Agrega uno en el formulario 1 para poder crear ofertas.
      </p>

      <form id="form-oferta" novalidate>
        <div id="resumen-oferta" class="resumen-errores" role="alert" hidden></div>

        <div class="campo">
          <label for="oferta-producto" class="req">Producto</label>
          <select id="oferta-producto" name="producto" aria-describedby="oferta-producto-error">
            <option value="">Selecciona un producto</option>
          </select>
          <p class="error" id="oferta-producto-error"></p>
        </div>

        <div class="campo">
          <label for="oferta-descuento" class="req">Descuento (%)</label>
          <input type="number" id="oferta-descuento" name="descuento" step="1" min="1" max="90"
                 placeholder="Entre 1 y 90" inputmode="numeric" aria-describedby="oferta-descuento-error">
          <p class="error" id="oferta-descuento-error"></p>
        </div>

        <div id="oferta-calculo" class="calculo" hidden></div>

        <div class="botones">
          <button type="submit" class="btn-primario">Enviar al catálogo</button>
          <button type="reset" class="btn-secundario">Limpiar</button>
        </div>
      </form>

      <div id="resultado-oferta" class="resultado" aria-live="polite" hidden></div>
    </section>

  </main>
</body>
</html>
