<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Inventario - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Sistema de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GestorApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="operacion.html">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Nuevo Producto</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Catálogo -->
    <main class="container mt-5">
        <h2 class="text-center mb-4 fw-bold" style="color: var(--ipn-guinda);">Catálogo de Productos</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Carrusel de Bootstrap -->
                <div id="carruselProductos" class="carousel carousel-dark slide shadow-sm p-4 bg-white rounded-3 border-top" style="border-color: var(--ipn-guinda) !important;">
                    <div class="carousel-inner" id="contenido-carrusel">
                        <!-- Las tarjetas de los productos se inyectarán aquí mediante JavaScript -->
                    </div>
                    
                    <!-- Controles del Carrusel -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carruselProductos" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carruselProductos" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
