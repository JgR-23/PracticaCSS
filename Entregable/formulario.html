<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Inventario - Nuevo Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Sistema de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GestorApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="operacion.html">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Nuevo Producto</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h2 class="card-title h4 mb-4 text-center">Registrar Nuevo Producto</h2>
                        
                        <!-- Contenedor para mensajes de error -->
                        <div id="mensajes-error" class="alert alert-danger d-none" role="alert"></div>

                        <form id="form-producto" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre del Producto *</label>
                                    <input type="text" class="form-control" id="nombre">
                                </div>
                                <div class="col-md-6">
                                    <label for="sku" class="form-label">Código SKU *</label>
                                    <input type="text" class="form-control" id="sku">
                                </div>
                                <div class="col-md-6">
                                    <label for="cantidad" class="form-label">Cantidad Inicial *</label>
                                    <input type="number" class="form-control" id="cantidad" min="1">
                                </div>
                                <div class="col-md-6">
                                    <label for="precio" class="form-label">Precio Unitario ($) *</label>
                                    <input type="number" class="form-control" id="precio" step="0.01" min="0.01">
                                </div>
                                <div class="col-12 text-center mt-4">
                                    <button type="submit" class="btn btn-primary px-5">Guardar Producto</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Contenedor para mostrar en pantalla lo ingresado por el usuario -->
                <div id="resultado-registro" class="alert alert-success d-none shadow-sm" role="alert">
                    <h4 class="alert-heading h5">¡Producto registrado con éxito!</h4>
                    <hr>
                    <p class="mb-0" id="datos-ingresados"></p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
